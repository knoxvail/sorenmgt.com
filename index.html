<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Soren Management</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --black:#080808;
  --white:#e8e4de;
  --accent:#d4c4aa;
  --dim:rgba(232,228,222,0.45);
}
html,body{
  width:100%;min-height:100%;
  overflow-x:hidden;
  background:var(--black);
  color:var(--white);
  font-family:'Montserrat',sans-serif;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:100;opacity:0.4;
}
body::after{
  content:'';
  position:fixed;inset:0;
  background:radial-gradient(ellipse at center,
    transparent 30%,
    rgba(4,4,4,0.45) 70%,
    rgba(2,2,2,0.82) 100%
  );
  pointer-events:none;z-index:1;
}
.bg-wrap{
  position:fixed;inset:0;
  overflow:hidden;
  z-index:0;
  pointer-events:none;
}
.bg-glow{
  position:absolute;
  top:38%;left:50%;
  transform:translate(-50%,-50%);
  width:140vmax;height:140vmax;
  background:radial-gradient(ellipse at center,
    rgba(8,8,8,0.0) 0%,
    rgba(40,40,40,0.45) 38%,
    rgba(8,8,8,0.0) 62%
  );
  animation:breathe 12s ease-in-out infinite;
  pointer-events:none;z-index:0;
}
@keyframes breathe{
  0%{transform:translate(-50%,-50%) scale(0.65);opacity:0.2;}
  50%{transform:translate(-50%,-50%) scale(1.1);opacity:1;}
  100%{transform:translate(-50%,-50%) scale(0.65);opacity:0.2;}
}

  100%{transform:scaleX(-1) scale(1.14) translateX(-2%);}
}

.container{
  width:100%;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;text-align:center;
  z-index:2;
}
.about-spacer{height:170vh;}
.about-scrim-fixed{
  position:fixed;left:0;right:0;bottom:0;height:48vh;z-index:2;
  pointer-events:none;opacity:0;
  background:linear-gradient(to top, rgba(6,6,6,0.74), rgba(6,6,6,0) 100%);
}

/* Logo — shifted up via margin */
.logo-wrap{
  margin-bottom:36px;
  opacity:0;
  animation:fadeUp 1s ease forwards 0.3s;
}
.logo-mark{
  width:180px;height:180px;
  margin:0 auto;
  cursor:pointer;
  display:block;
  will-change:transform;
}
.logo-mark svg{width:100%;height:100%;}

.logo-circle{
  fill:none;stroke:var(--white);stroke-width:0.8;
  stroke-dasharray:226;stroke-dashoffset:226;
  animation:drawCircle 1.2s cubic-bezier(0.4,0,0.2,1) forwards 0.6s;
}
.logo-slash{
  stroke:var(--white);stroke-width:0.8;stroke-linecap:round;
  stroke-dasharray:72;stroke-dashoffset:72;
  animation:drawSlash 0.6s cubic-bezier(0.4,0,0.2,1) forwards 1.9s;
}
@keyframes drawCircle{to{stroke-dashoffset:0;}}
@keyframes drawSlash{to{stroke-dashoffset:0;}}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}

/* Stacked wordmark */
.wordmark{
  display:flex;flex-direction:column;
  align-items:center;
  gap:6px;
  margin-bottom:20px;
}

.soren-line{
  font-family:'Cormorant Garamond',serif;
  font-weight:300;
  font-size:clamp(3rem,8vw,5.5rem);
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--white);
  display:flex;
  justify-content:center;
  width:100%;
  line-height:1;
  text-indent:0.2em;
}

.management-line{
  font-family:'Cormorant Garamond',serif;
  font-weight:300;
  font-size:clamp(1.2rem,3vw,2rem);
  letter-spacing:0.55em;
  text-transform:uppercase;
  color:var(--white);
  display:flex;
  justify-content:center;
  width:100%;
  line-height:1;
  text-indent:0.55em;
}

.letter{
  opacity:0;display:inline-block;
  animation:letterIn 0.5s cubic-bezier(0.4,0,0.2,1) forwards;
}
.space{display:inline-block;width:0.4em;}

@keyframes letterIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

.tagline{
  font-family:'Montserrat',sans-serif;
  font-weight:200;
  font-size:clamp(0.45rem,1vw,0.6rem);
  letter-spacing:0.65em;
  text-transform:uppercase;
  color:var(--accent);
  opacity:0;
  animation:fadeUp 1s ease forwards 3.8s;
}

/* Nav */
.nav{
  position:fixed;top:36px;width:100%;
  display:flex;justify-content:center;
  opacity:0;animation:fadeUp 0.8s ease forwards 4.2s;
  z-index:200;
}
.nav-btn{
  font-family:'Montserrat',sans-serif;font-weight:300;
  font-size:0.62rem;letter-spacing:0.4em;text-transform:uppercase;
  color:var(--dim);text-decoration:none;
  background:none;border:none;cursor:pointer;
  transition:color 0.3s ease;padding:0;
}
.nav-btn:hover{color:var(--white);}

/* About overlay */

.scroll-hint{
  position:fixed;bottom:34px;left:50%;
  transform:translateX(-50%);
  font-family:'Montserrat',sans-serif;font-weight:300;
  font-size:0.6rem;letter-spacing:0.4em;text-transform:uppercase;
  color:rgba(232,228,222,0.38);
  z-index:52;opacity:0;
  transition:opacity 0.6s ease;
  pointer-events:none;
}
.scroll-hint.show{opacity:1;animation:hintBob 1.8s ease-in-out infinite;}
@keyframes hintBob{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,5px);}}

.about-text{
  position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);
  margin:0 auto;
  z-index:3;
  padding:0 32px;
  font-family:'Cormorant Garamond',serif;
  font-weight:300;
  font-size:clamp(1.05rem,1.9vw,1.3rem);
  line-height:1.85;
  color:rgba(232,228,222,0.92);
  max-width:620px;
  display:flex;flex-wrap:wrap;justify-content:center;gap:0.28em;
}
.about-text .word{
  opacity:0;display:inline-block;
  transform:translateY(6px);
  transition:opacity 0.4s ease, transform 0.4s ease;
}
.about-text .word.show{opacity:1;transform:translateY(0);}
.about-text strong{color:#e8e4de;font-weight:400;}

.psalm-about{
  position:fixed;
  bottom:32px;left:50%;
  transform:translateX(-50%);
  font-family:'Cormorant Garamond',serif;
  font-weight:300;
  font-size:0.62rem;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:rgba(232,228,222,0.32);
  opacity:0;
  transition:opacity 0.6s ease;
  z-index:51;
  white-space:nowrap;
}
.psalm-about.show{opacity:1;}
</style>
</head>
<body>
<div class="bg-wrap">
<div class="bg-glow"></div>
<div class="bg-image"></div>
</div>

<div class="about-scrim-fixed" id="aboutScrim"></div>

<div class="container" id="main">
  <div class="logo-wrap">
    <div class="logo-mark" id="logoMark">
      <svg viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
        <circle class="logo-circle" cx="36" cy="36" r="28"/>
        <line class="logo-slash" x1="14" y1="58" x2="58" y2="14"/>
      </svg>
    </div>
  </div>

  <div class="wordmark">
    <div class="soren-line" id="sorenLine"></div>
    <div class="management-line" id="managementLine"></div>
  </div>

  <div class="tagline">Only Forward</div>
</div>

<div class="about-spacer"></div>
<p class="about-text" id="aboutText"></p>

<div class="scroll-hint" id="scrollHint">Scroll&nbsp; &darr;</div>

<script>
// Build "SOREN" letter by letter
const sorenEl = document.getElementById('sorenLine');
const mgmtEl = document.getElementById('managementLine');
const baseDelay = 2.0;
const ld = 0.09;

[...'"Soren"'.replace(/"/g,'')].forEach((c,i) => {
  const s = document.createElement('span');
  s.className = c===' '?'space':'letter';
  if(c!==' '){s.textContent=c;s.style.animationDelay=`${baseDelay+i*ld}s`;}
  sorenEl.appendChild(s);
});

// "MANAGEMENT" starts after SOREN finishes
const sorenLen = "Soren".length;
const mgmtStart = baseDelay + sorenLen * ld + 0.15;
[...'"Management"'.replace(/"/g,'')].forEach((c,i)=>{
  const s=document.createElement('span');
  s.className=c===' '?'space':'letter';
  if(c!==' '){s.textContent=c;s.style.animationDelay=`${mgmtStart+i*(ld*0.7)}s`;}
  mgmtEl.appendChild(s);
});

// Logo stays locked to center (parallax removed for perfect centering)
let parallaxActive = false;

// About text
const aboutContent="Soren Management is a boutique firm based in Newport Beach, California, specializing in value-add operations. We take on a small number of opportunities at a time and work them closely, improving how each one runs rather than chasing scale for its own sake. Small by design and built for precision over volume, with the kind of attention that only stays possible when you keep the portfolio deliberate.";
const aboutTextEl=document.getElementById('aboutText');
aboutContent.split(' ').forEach((word,i)=>{
  const span=document.createElement('span');
  span.className='word';
  if(i===0) span.innerHTML='<strong>Soren</strong>';
  else if(i===1) span.innerHTML='<strong>Management</strong>';
  else span.textContent=word;
  aboutTextEl.appendChild(span);
});
const wordEls=aboutTextEl.querySelectorAll('.word');

// Scroll-driven reveal: copy fixed at the bottom fills in as you scroll DOWN (position-based),
// and clears noticeably faster on the way UP so it never lingers over the logo.
const aboutText=document.getElementById('aboutText');
const aboutScrim=document.getElementById('aboutScrim');
const scrollHint=document.getElementById('scrollHint');
const N=wordEls.length;
let lastY=window.scrollY;
let shownReveal=0;
const clamp=v=>Math.min(1,Math.max(0,v));

function updateReveal(){
  const total=document.documentElement.scrollHeight-window.innerHeight;
  if(total<=0)return;
  const p=clamp(window.scrollY/total);
  const up=window.scrollY<lastY-0.5;
  lastY=window.scrollY;
  const downReveal=Math.ceil(clamp((p-0.25)/0.70)*N);    // ~3 scroll clicks of dead zone, then appears
  if(up){
    const upReveal=Math.ceil(clamp((p-0.70)/0.25)*N);    // clears fast on the way up, before the logo returns
    shownReveal=Math.min(shownReveal,upReveal);
  }else{
    shownReveal=downReveal;
  }
  if(window.scrollY<total*0.22) shownReveal=0;
  shownReveal=Math.max(0,Math.min(N,shownReveal));
  wordEls.forEach((w,i)=>w.classList.toggle('show',i<shownReveal));
  if(aboutScrim) aboutScrim.style.opacity=String(Math.min(0.9,(shownReveal/N)*1.2));
  if(scrollHint) scrollHint.classList.toggle('show',shownReveal<1);
}
window.addEventListener('scroll',updateReveal,{passive:true});
window.addEventListener('resize',updateReveal);
updateReveal();
</script>
</body>
</html>
