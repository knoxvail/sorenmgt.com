<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soren Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #080808;
      --white: #f0ede8;
      --accent: #c8b89a;
      --dim: rgba(240, 237, 232, 0.18);
      --dimmer: rgba(240, 237, 232, 0.07);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.4;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Logo mark */
    .logo-mark {
      width: 72px;
      height: 72px;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.3s;
    }

    .logo-mark svg {
      width: 100%;
      height: 100%;
    }

    /* Circle */
    .logo-circle {
      fill: none;
      stroke: var(--white);
      stroke-width: 1.2;
      stroke-dasharray: 226;
      stroke-dashoffset: 226;
      animation: drawCircle 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.6s;
    }

    /* Slash line — draws left to right, extends beyond circle */
    .logo-slash {
      stroke: var(--white);
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-dasharray: 72;
      stroke-dashoffset: 72;
      animation: drawSlash 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards 1.9s;
    }

    @keyframes drawCircle {
      to { stroke-dashoffset: 0; }
    }

    @keyframes drawSlash {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Wordmark */
    .wordmark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      opacity: 0;
      animation: fadeUp 1s ease forwards 1.2s;
    }

    .company-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--white);
    }

    .divider {
      width: 1px;
      height: 28px;
      background: var(--dim);
      opacity: 0;
      animation: fadeUp 1s ease forwards 1.8s;
    }

    .tagline {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: clamp(0.55rem, 1.2vw, 0.7rem);
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      animation: fadeUp 1s ease forwards 2.2s;
    }

    /* Nav */
    .nav {
      position: fixed;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 48px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 2.8s;
    }

    .nav a {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 0.62rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .nav a:hover {
      color: var(--white);
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 48px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 3s;
    }

    .psalm {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 0.62rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(240, 237, 232, 0.22);
    }

    /* Subtle background glow */
    .glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse at center, rgba(200, 184, 154, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container > * { position: relative; z-index: 1; }
  </style>
</head>
<body>

  <div class="glow"></div>

  <nav class="nav">
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </nav>

  <div class="container">
    <div class="logo-mark">
      <svg viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
        <!-- Circle centered at 36,36 with radius 28 -->
        <circle class="logo-circle" cx="36" cy="36" r="28" />
        <!-- Slash: diagonal like ø, extends beyond circle -->
        <line class="logo-slash" x1="14" y1="58" x2="58" y2="14" />
      </svg>
    </div>

    <div class="wordmark">
      <div class="company-name">Soren Management</div>
    </div>

    <div class="divider"></div>

    <div class="tagline">Only Forward</div>
  </div>

  <footer class="footer">
    <span class="psalm">Psalm 139</span>
  </footer>

</body>
</html>
